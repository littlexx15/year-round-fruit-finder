name: Refresh fruit data

on:
  schedule:
    - cron: '23 1 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: fruit-scan
  cancel-in-progress: false

jobs:
  scan:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Scan year-round fruit products
        run: node scripts/scan.js
      - name: Save updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/products.json
          git diff --cached --quiet || git commit -m "data: refresh year-round fruit list"
          git push
      - name: Assemble static website with fresh data
        run: |
          mkdir -p dist/data
          cp -R public/. dist/
          cp data/products.json dist/data/products.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy fresh data to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
